name = "cividge-kv-worker"
main = "server.js"
compatibility_date = "2026-09-01"
workers_dev = true

routes = [
  { pattern = "kv.k7m.f5.si", custom_domain = true },
  { pattern = "misskey-media.okpn.f5.si", custom_domain = true },
  { pattern = "ipfs-relay.k7m.f5.si", custom_domain = true },
  { pattern = "relay.k7m.f5.si", custom_domain = true }
]

# Worker の前で Cache-Control に従うエッジキャッシュを照会する。
# 公開メディアと短時間の 404 はキャッシュヒット時に JS/KV を実行しない。
# [cache]
# enabled = true

[vars]
# Static Pages public entry points allowed to identify their original host.
# Add comma-separated hosts here when another relay is intentionally deployed.
STATIC_RELAY_PUBLIC_HOSTS = "content-relay.pages.dev,testunko.pages.dev,punipuni-media.pages.dev"
# The custom-zone endpoint behind the static Pages relay.  Its /r/<file> URL is
# globally purged when CLOUDFLARE_ZONE_ID and CLOUDFLARE_PURGE_TOKEN are set.
STATIC_RELAY_BACKEND_HOSTS = "ipfs-relay.k7m.f5.si,relay.k7m.f5.si"
ADMIN_API_TOKEN = "cividge_secret_99f821a603c4"
UPLOAD_TOKEN = "o33eVwZHlbJt8cKhCuNwLZYdtYqz1omSebbxJlZ0"

[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "cividge"

[[kv_namespaces]]
binding = "CIVIDGE_KV"
id = "ff45707014424ab3afac57fda8c305de"

[[kv_namespaces]]
binding = "IPFS_KV"
id = "ff45707014424ab3afac57fda8c305de"
