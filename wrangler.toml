name = "cividge-kv-worker"
main = "server.js"
compatibility_date = "2026-09-01"
workers_dev = true

routes = [
  { pattern = "kv.k7m.f5.si", custom_domain = true },
  { pattern = "misskey-media.okpn.f5.si", custom_domain = true },
  { pattern = "relay.k7m.f5.si", custom_domain = true }
]

# Worker の前で Cache-Control に従うエッジキャッシュを照会する。
# 公開メディアと短時間の 404 はキャッシュヒット時に JS/KV を実行しない。
# [cache]
# enabled = true

[vars]
# Static Pages public entry points allowed to identify their original host.
# Add comma-separated hosts here when another relay is intentionally deployed.
STATIC_RELAY_PUBLIC_HOSTS = "content-relay.pages.dev,testunko.pages.dev,punipuni-media.pages.dev,test-up.pages.dev"
# The custom-zone endpoint behind the static Pages relay.  Its /r/<file> URL is
# globally purged when CLOUDFLARE_ZONE_ID and CLOUDFLARE_PURGE_TOKEN are set.
STATIC_RELAY_BACKEND_HOSTS = "relay.k7m.f5.si"
# Keep false unless FILEBASE_IPFS_API_KEY is scoped to a bucket reserved for
# Cividge Worker RPC pins only. A shared bucket cannot distinguish pin owners.
FILEBASE_DEDICATED_BUCKET = "false"

[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "cividge"

[[kv_namespaces]]
binding = "CIVIDGE_KV"
id = "e427d94815ce491cb908489ef76251c7"

[[durable_objects.bindings]]
name = "OBJECT_LIFECYCLE"
class_name = "ObjectLifecycleV2"

[[durable_objects.bindings]]
name = "LINK_BINDING"
class_name = "LinkBindingV2"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ObjectLifecycle"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["LinkBinding"]

[[migrations]]
tag = "v3-clean-authority-cutover"
new_sqlite_classes = ["ObjectLifecycleV2", "LinkBindingV2"]

[[migrations]]
tag = "v4-retire-old-authority"
deleted_classes = ["ObjectLifecycle", "LinkBinding"]
